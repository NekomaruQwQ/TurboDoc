# @human-maintained

[package]
name = "turbodoc"
version = "0.1.0"
edition = "2024"

[dependencies.nkcore]
package = "nkcore-windows"
git = "https://github.com/NekomaruQwQ/Nekomaru-Rust.git"
rev = "f09b73c3"
features = ["debug", "winit"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.6", features = ["derive", "env"] }
dashmap = "6"
http = "1.5.0"
http-cache-semantics = { version = "3.0.0", features = ["serde"] }
log = "0.4.33"
pretty_env_logger = "0.5.0"
reqwest = { version = "0.13.4" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tap = "1.0.1"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
webview2-com = "0.39.1"
widestring = "1.2.1"
win32job = "2.0.3"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.winit]
version = "0.30.13"
default-features = false
features = ["rwh_06"]

[dependencies.eframe]
version = "0.36.1"
default-features = false
features = ["accesskit", "default_fonts", "wgpu_no_default_features"]

[dependencies.wgpu]
version = "30.0.0"
default-features = false
features = [
    "std",
    "dx12",
    "wgsl",
]

[dependencies.native-dialog]
version = "0.9.7"
features = [
    "windows_dpi_awareness",
    "windows_visual_styles",
]
