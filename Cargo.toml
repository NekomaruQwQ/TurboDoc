[package]
name = "turbodoc"
version = { workspace = true }
edition = { workspace = true }

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies.nkcore]
path = "../Nekomaru-Rust/nkcore-windows/"
package = "nkcore-windows"
features = ["debug", "winit"]

[dependencies]
nkcore = { workspace = true }

anyhow = "1.0"
dashmap = "6"
clap = { version = "4.6.4", features = ["derive", "env"] }
http = "1.4.2"
http-cache-semantics = { version = "3", features = ["serde"] }
log = "0.4.33"
pretty_env_logger = "0.5.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.3"
tap = "1.0.1"
tokio = { version = "1.53.1", features = ["full"] }
webview2-com = "0.39.1"
widestring = "1.2.1"
win32job = "2"
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }

# LOCK: reqwest@0.13.0 depends on aws-lc-sys which fails to build
# due to the following issue:
#       https://github.com/seanmonstar/reqwest/issues/2937
reqwest = { version = "0.13.4" }

native-dialog = { version = "0.9.7", features = [
    "windows_dpi_awareness",
    "windows_visual_styles",
]}

windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]}
